gates_before_final_training:
  - refreshed training lists written by tools/make_refresh_list.py from COMPLETE samples, hashed, manifests committed
  - training_tree_confirmed true (split-move vs snap = the Round-2 production vertex)
  - nu_mu chain frozen (final + level-1 decision) and numu_score / numu_*_score recomputed on the refreshed training CAFs (SP numu, SP other)
    # 2026-11-28: numu_round3af released (final + numu_1 / numu_2 / cosmict_10); offline re-scoring of WCL1116 = the integration audit
  - nu_e level-1 scores of the training CAFs equal the collaboration's chosen nu_e release (SP ncpi0)
    # 2026-11-28: nue_round4_ruleA_v2 RETRAINED the 15 level-1 models (supersedes 'nu_e level-1 still fixed'); nu_e final is not an SP input
  - SP other: wcl1116-fg-beamoff-train odd-run half available on the training side and approved_by filled
  - Round-2 production configuration (toolkit, DL bundle, config md5) equals the one recorded above, or the refresh is redone
