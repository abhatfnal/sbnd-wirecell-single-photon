[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "wc-upstream-chain"
version = "1.0.0"
description = "Toolkit-equivalent offline scoring of the upstream SBND Wire-Cell nu_mu / nu_e tagger BDTs (DEVELOPMENT ONLY)"
requires-python = ">=3.8"
dependencies = ["numpy>=1.20", "pandas>=1.3"]

[project.optional-dependencies]
parquet = ["pyarrow>=8"]
test = ["pytest>=7", "pyarrow>=8"]

[tool.setuptools]
packages = ["wc_upstream_chain"]

[tool.setuptools.package-data]
wc_upstream_chain = ["data/*.json", "data/*.txt"]
