  upstream_classifier_inputs: [cosmict_10_score, numu_1_score, numu_2_score, numu_score]   # UbooneNumuBDTScorer level-1 + final
  default_handling:
    float32: true
    nan_policy: rows with any non-finite input are not scored (TMVA would return -999); counted per sample
    unfilled_block: shw_sp_* hold tagger defaults when shw_sp_filled == 0; cosmict_<k>_* hold defaults when cosmict_<k>_filled == 0
    empty_list_defaults: numu_1_score -0.4, numu_2_score -0.1, cosmict_10_score 0.7 (toolkit defaults)
    shower_charge_scale: MicroBooNE multiplies shw_sp_vec_*dedx / dQ_dx_* by em_charge_scale = 1.0 (no-op) before scoring
    reco_nuvtxY: T_kine.kine_nu_y_corr (baseline_v0/docs/RECO_NUVTX_MAPPING.md); SBND vs MicroBooNE frame differs

label:
  definition: null
  source_established:
    - "note 1125 sec 3: 'Other' background BDT targets remaining backgrounds, primarily cosmic induced events and neutrino events whose true scattering is outside the TPC but whose charge scatters in and is reconstructed"
    - "note 1125 sec 4: the 'Other' sideband is primarily non-beam induced (cosmic) events and beam events outside the TPC that scatter in"
    - "PRL 136 181806: 'other' backgrounds (mainly consisting of cosmic rays and neutrinos interacting outside of the TPC)"
  strongly_inferred:
    - positive class = single-photon signal events (same signal sample as the sibling BDTs)
  unknown:
    - negative class membership (cosmic-only EXT data? overlay events with poor truth matching? dirt? every background not covered by the other three BDTs?)
    - whether the class was defined by truth or by reconstruction quantities; preselection; samples; weights / class balancing; event vs candidate rows
  sbnd_truth_available_if_recovered: [T_match level-2 partner (cosmic = truth_nu_idx < 0 or no partner), T_truth_nu vertex vs active volume (dirt / out-of-TPC), match IoU, T_truth_pf]
  sbnd_sample_gap: >
    Cosmic-only real data exist only as official fg1 beam-off (evaluation side under the Round-2 rule). Aurora MC has
    cosmic-matched candidates (T_match truth_nu_idx < 0) but no cosmic-only sample. A recovered definition that needs
    EXT-like data needs either an approved exception or a new Aurora cosmic sample.
  question_for_owners: >
    For single_photon_other_bdt_final.xml: what exactly was the negative ("other") training class -- which samples
    (EXT beam-off, overlay cosmics, dirt), which truth or reco expression selected them, was it "everything not numu CC
    / NC pi0 / nue CC" -- what was the positive class, what preselection was applied to training rows, and were weights
    or class balancing used?

preselection:
  microboone_reference: [Wire-Cell generic neutrino selection, 5 < reco_nuvtxX < 250 cm, shw_sp_n_20mev_showers > 0]
  sbnd_development_pool_proposed: [not is_placeholder, shw_sp_filled == 1, shw_sp_n_20mev_showers > 0, label readable]
  analysis_volume: OPEN
candidate_policy: same as single_photon_ncpi0_training_spec v0.1.0 (OPEN, decided with the label)

samples:
  development:
    - {id: aurora-r2-bnb,   list: /lus/flare/projects/neutrinoGPU/yuhw/production-prep/dlspace/lists/bnb-merged-cafs.txt,   files: 11888}
    - {id: aurora-r2-ncdr,  list: /lus/flare/projects/neutrinoGPU/yuhw/production-prep/dlspace/lists/ncdr-merged-cafs.txt,  files: 17603}
    - {id: aurora-r2-nuecc, list: /lus/flare/projects/neutrinoGPU/yuhw/production-prep/dlspace/lists/nuecc-merged-cafs.txt, files: 61248}
  allowed_input_roots: [/lus/flare/projects/neutrinoGPU/yuhw/production-prep/dlspace]
  excluded_official_evaluation: [fg1-mc-cv, fg1-mc-nuecc, fg1-mc-ncdr, fg1-beam-off (both halves, incl. fg1-beam-off-train),
                                 run3-bnb-data, open-run1-bnb-data, selected-data (prod 7),
                                 official SAM aurora_SBND2026A_gen2 EX_ncdeltarad (Thomas, twester/), Xin hold-out lists]
  approved_exceptions: []

split:
  scheme: subrun_parity_valhash_v1
  unit: (sample, run, subrun)
  test: odd subrun
  validation: even subrun with blake2b(seed|sample|run|subrun) < 0.25
  train: remaining even subruns
  seed: 20261117

weights:
  class_weights: UNKNOWN for the frozen model; development default none
  event_weights: none
  exposure: production POT records only; never rec.hdr.pot of filtered Aurora samples

xgboost:
  version: 3.4.1
  objective: binary:logitraw
  base_score: 0.5
  n_estimators: 300
  max_depth: TO_READ_FROM_FROZEN_XML
  learning_rate: UNKNOWN
  tree_method: hist
  random_state: 20261117
  early_stopping: on the validation fold only

metrics: [AUC per sample on the test fold, efficiency/rejection at the frozen cut in log10-odds space and at matched efficiency,
          per background category (cosmic-matched, out-of-active-volume, other), overtraining comparison, score distributions,
          feature importance, scorer equivalence with zero decision flips]

deployment:
  native: XGBoost JSON (feature order = feature_list)
  production: TMVA BDT XML, BoostType=Grad, NTransformations=0, variables in feature_list order, via a validated exporter
  score: log10((1+tanh(raw))/(1-tanh(raw))) = (2/ln 10) raw
  proposed_name: single_photon_other_bdt_sbnd_round2_v1

dependencies:
  upstream_classifiers: [nu_mu level-1 numu_tagger1, numu_tagger2, cos_tagger_10 and nu_mu final numu_scalars_scores_0923
                         (UbooneNumuBDTScorer) -- the final numu_score changes when Xuyang's nu_mu retrain is installed]
  vertexing: DL neutrino vertex -- Snehadri's update changes every input
  reconstruction: "WCT pin of the training CAFs (aurora-r2 wct_version sbnd-dlvtx-35-pre-master-merge-54-ga2785870)"
