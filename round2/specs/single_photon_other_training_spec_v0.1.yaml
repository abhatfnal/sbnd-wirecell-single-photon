            shw_sp_vec_dQ_dx_11, shw_sp_vec_dQ_dx_12, shw_sp_vec_dQ_dx_13, shw_sp_vec_dQ_dx_14, shw_sp_vec_dQ_dx_15,
            shw_sp_vec_dQ_dx_16, shw_sp_vec_dQ_dx_17, shw_sp_vec_dQ_dx_18, shw_sp_vec_dQ_dx_19, shw_sp_vec_median_dedx,
            shw_sp_proton_length_1, shw_sp_proton_dqdx_1, shw_sp_proton_energy_1, shw_sp_proton_length_2, shw_sp_proton_dqdx_2,
