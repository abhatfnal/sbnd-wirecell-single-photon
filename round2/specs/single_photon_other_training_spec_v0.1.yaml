            cosmict_2_flag_inside, cosmict_2_angle_beam, cosmict_2_flag_dir_weak, cosmict_2_dQ_dx_end, cosmict_2_dQ_dx_front,
            cosmict_2_theta, cosmict_2_phi, cosmict_2_valid_tracks, cosmict_flag_4, cosmict_4_filled, cosmict_4_flag_inside,
            cosmict_4_angle_beam, cosmict_4_connected_showers, cosmict_flag_3, cosmict_3_filled, cosmict_3_flag_inside,
            cosmict_3_angle_beam, cosmict_3_flag_dir_weak, cosmict_3_dQ_dx_end, cosmict_3_dQ_dx_front, cosmict_3_theta,
            cosmict_3_phi, cosmict_3_valid_tracks, cosmict_flag_5, cosmict_5_filled, cosmict_5_flag_inside, cosmict_5_angle_beam,
            cosmict_5_connected_showers, cosmict_flag_6, cosmict_6_filled, cosmict_6_flag_dir_weak, cosmict_6_flag_inside,
            cosmict_6_angle, cosmict_flag_7, cosmict_7_filled, cosmict_7_flag_sec, cosmict_7_n_muon_tracks,
            cosmict_7_total_shower_length, cosmict_7_flag_inside, cosmict_7_angle_beam, cosmict_7_flag_dir_weak,
            cosmict_7_dQ_dx_end, cosmict_7_dQ_dx_front, cosmict_7_theta, cosmict_7_phi, cosmict_flag_8, cosmict_8_filled,
            cosmict_8_flag_out, cosmict_8_muon_length, cosmict_8_acc_length, cosmict_flag_9, cosmic_flag, cosmic_filled,
            cosmict_flag, numu_cc_flag, shw_sp_br2_num_valid_tracks, shw_sp_br2_n_shower_main_segs, shw_sp_br2_sg_length,
            shw_sp_br4_1_shower_main_length, shw_sp_br4_1_shower_total_length, shw_sp_br4_1_min_dis,
            shw_sp_br4_1_flag_avoid_muon_check, shw_sp_br4_1_n_vtx_segs, shw_sp_br4_1_n_main_segs, shw_sp_br4_2_ratio_45,
