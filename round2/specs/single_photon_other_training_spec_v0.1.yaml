# Training specification: SBND single-photon "other" background-rejection BDT.
# Versioned; a change to any field below needs a new spec_version. See round2/docs/SP_BDT_DEPENDENCY_AND_TARGET_AUDIT.md.
spec_id: single_photon_other_training_spec
spec_version: 0.1.0
date: 2026-11-17
author: Avinay Bhat (prepared with Claude Code)
status: BLOCKED     # BLOCKED | READY_FOR_DEVELOPMENT_TRAINING | READY_FOR_FINAL_TRAINING
status_reason: >
  FINAL OTHER RETRAINING IS BLOCKED BY THE UNKNOWN TRAINING TARGET. "Other" is not a self-defining physics class.
  The only sources (MicroBooNE note 1125, PRL 136 181806) say it targets "remaining backgrounds, primarily cosmic
  induced events and neutrino events in which the true scattering takes place outside of the TPC but charge scatters
  in". The exact positive / negative classes, the cosmic sample (EXT beam-off data or MC), whether every background
  not covered by the numu-CC / NC-pi0 / nue-CC BDTs was included, and any weighting are not recoverable from any
  reachable source. In addition, its numu_score input will change when Xuyang's nu_mu BDT is retrained.

classifier:
  name: single_photon_other
  purpose: Sibling background-rejection BDT; keeps events with single_photon_other_score > threshold.
  frozen_predecessor:
    xml: single_photon_other_bdt_final.xml
    sha256: 8c0ac375e957f5b332bc35339e4ebcbfef35bb778fb73315b06a814e600dbb16
    copied_from: /exp/uboone/app/users/uboonepro/bbogart/wcp-uboone-bdt/weights (FNAL); reference bundle on Eagle
    booked_in: brb-rightback/wcp-uboone-bdt-eyandel @ 0100d4b6 apps/bdt_convert.cxx (reader_single_photon_other, "MyBDT")
    technology: XGBoost (note 1125) stored as TMVA BDT XML, BoostType=Grad, 300 trees, boostWeight 1
    stored_score: log10((1+v)/(1-v)), v = TMVA EvaluateMVA = tanh(raw)
    score_direction: higher = more single-photon-like (keep score > threshold)
    frozen_threshold_log10_odds: 0.2         # inc/WCPLEEANA/cuts.h is_singlephoton_sel; = EvaluateMVA > 0.2263
    loose_threshold_log10_odds: -0.4

