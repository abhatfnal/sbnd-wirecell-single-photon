# Sample registry for the NC-Delta 1g0p/1g1p baseline.
# Every number below is KNOWN from Haiwang's READMEs (fg1/README.md, opendata-fixeddev/DATASET.md)
# or from the prepared lists, and is re-verified by scripts/make_manifests.py (file counts)
# and the smoke test (schema). POT weights are intentionally NOT assigned yet.
#
# Production reconstruction (all four available samples): stored uboone SCN DL vertexer
#   Trun.dl_weights = uboone/scn_vtx/t48k-m16-l5-lr5d-res0.5-CP24.pth
# NOT DV2-MAX (vertex_method=dv2_split_move / dv2max/r7_cloud/bundle.json), NOT Fix2.
schema:
  mc_and_beam_off:  {md5: d4396a3490ea5aec4b02f0c34fa9db33, n_branches: 2401}
  beam_on_open:     {md5: c845fe94fbe59b507ef50ea87417c3f9, n_branches: 2283}  # strict subset of MC schema
defaults:
  xrootd_door: root://fndcadoor.fnal.gov
  require: {wc_valid: 1}

samples:
  bnb_cv:
    status: available
    role: background_evaluation
    may_train: false
    may_evaluate: true
    is_mc: true
    label: "BNB CV MC (Gen2 2026, prodgenie_corsika_proton_rockbox0p1)"
    production: "fg1 / SBND2026A gen2 BNBLight CV v10_14_02_03, WCT sbnd-wc-flatcaf 4b6853d4"
    source_list: /pnfs/sbnd/persistent/users/yuhw/prod-fermigrid/fg1/lists/mc-cv.merged-caf.txt
    manifest: manifests/bnb_cv.tsv.gz
    n_files_listed: 37742        # 37,720 OK + 22 PARTIAL
    n_caf_events: 500000
    n_wc_valid_events: 499899
    schema_md5: d4396a3490ea5aec4b02f0c34fa9db33
    provenance_note: "seeded random subset of the SAM definition; POT must be summed over the LISTED files"
  nuecc:
    status: available
    role: background_control_only
    may_train: false
    may_evaluate: true
    is_mc: true
    label: "nueCC MC (Gen2 Exclusive 2026)"
    production: "fg1 / SBND2026A gen2 EX_nuecc v10_14_02_05, WCT sbnd-wc-flatcaf 4b6853d4"
    source_list: /pnfs/sbnd/persistent/users/yuhw/prod-fermigrid/fg1/lists/mc-nuecc.merged-caf.txt
    manifest: manifests/nuecc.tsv.gz
    n_files_listed: 11441        # 11,421 OK + 20 PARTIAL (4 EMPTY pairs have no CAF)
    n_caf_events: 100003
    n_wc_valid_events: 99946
    schema_md5: d4396a3490ea5aec4b02f0c34fa9db33
    provenance_note: "exclusive nueCC sample: NOT a representative BNB mixture; do not add to bnb_cv without a defined normalisation"
  beam_off:
    status: available
    role: data_validation
    may_train: false
    may_evaluate: true
    is_mc: false
    label: "InTime-Run1 beam-off data (strmOffBeamLight)"
    production: "fg1 / data_SBND2026A_gen2_InTime-Run1 v10_14_02_02, WCT sbnd-wc-flatcaf 4b6853d4 (+FrameShift)"
    source_list: /pnfs/sbnd/persistent/users/yuhw/prod-fermigrid/fg1/lists/beam-off.merged-caf.txt
    manifest: manifests/beam_off.tsv.gz
    n_files_listed: 1058         # 1,054 OK + 4 PARTIAL
    n_caf_events: 49970
    n_wc_valid_events: 49917
    schema_md5: d4396a3490ea5aec4b02f0c34fa9db33
  beam_on_open:
    status: available
    role: data_validation
    may_train: false
    may_evaluate: true
    is_mc: false
    label: "Open BNB FixedDev beam-on data, runs 18255-18259 (Respin CAF)"
    production: "opendata-fixeddev, sbndbuild03, WCT sbnd-wc-flatcaf f6fd2209 (older, before truth matching)"
    source_list: /pnfs/sbnd/persistent/users/yuhw/prod-sbndbuild03/opendata-fixeddev/lists/merged-caf.txt
    manifest: manifests/beam_on_open.tsv.gz
    n_files_listed: 1817         # 1,816 OK + 1 PARTIAL (d5055859)
    n_caf_events: 89946
    n_wc_valid_events: 89921
    schema_md5: c845fe94fbe59b507ef50ea87417c3f9
    provenance_note: "older schema: use ONLY branches common with MC; no MC truth/matching trees"

  # ---------------------------------------------------------------------------------------------------------
  # Signal samples. official_gen2_ncdelta: every number below was MEASURED (SAM census 2026-11-06; merged CAFs 2026-11-10). aurora_ncdelta_training: nothing recorded.
  # Dataset roles (Haiwang): official Gen2 samples on Fermilab = EVALUATION; Aurora isolated samples = training/development.
  official_gen2_ncdelta:
    role: signal_evaluation
    is_mc: true        # enables the MC truth reads of the registered merged-CAF manifest
    # VERIFIED 2026-11-10 from the actual files (scripts/register_official_ncdelta_wc.py, provenance gate OPEN): the official Wire-Cell merged CAFs exist.
    status: available
    official_flatcaf_status: available        # VERIFIED 2026-11-06: SAM definitions evaluate; files open from EAF over XRootD
    wirecell_merged_status: available         # fg1 evaluation chain, FermiGrid prod #6 (Haiwang Yu, 2026-11-10); 9,150 non-empty merged CAFs
    manifest: manifests/official_gen2_ncdelta_wc.tsv.gz
    n_files_listed: 9150
    n_caf_events: 13772          # events stored in the 9,150 non-empty merged CAFs (the SAM flatCAF census has 13,773: one CAF is missing from the production)
    n_wc_valid_events: 13772
    schema_md5: d4396a3490ea5aec4b02f0c34fa9db33
    wirecell_merged:
      production_id: ncdr (HaiwangYu/sbnd-wirecell-production issue #6), date 2026-11-10, configuration label fg1 (evaluation)
      path: /pnfs/sbnd/persistent/users/yuhw/prod-fermigrid/ncdr/mc-ncdr/<id>/   # README.md and lists/ one level up; XRootD door maps /pnfs/sbnd -> /pnfs/fnal.gov/usr/sbnd
      pairs: 15776          # 9,150 OK (non-empty merged CAF), 6,626 EMPTY (no events, no merged CAF), 0 PARTIAL; 729 reco1 files not run (728 truly without a flatCAF + 1 bookkeeping miss)
      merged_cafs: 9150
      events: 13772         # all wc.valid == 1 (MEASURED from the files; 13,773 in the truth census: 1 event never processed, see docs/analysis/OFFICIAL_NCDELTA_WC_ARRIVAL_REPORT.md)
      wc_valid: 13772
      schema: {md5: d4396a3490ea5aec4b02f0c34fa9db33, wc_branches: 2401}
      wct: {version_in_files: "sbnd-dlvtx-35-pre-master-merge-2026-09-02-424-g78f81c64", declared_commit: "4b6853d4 (HaiwangYu/wire-cell-toolkit sbnd-wc-flatcaf)", larwirecell_declared: "ad5d942", sbndcode_declared: "v10_14_02_03 e26:prof"}
      dl_weights: uboone/scn_vtx/t48k-m16-l5-lr5d-res0.5-CP24.pth
      bdt_weights_dir: uboone/weights
      provenance_gate: OPEN (tables/official_signal/arrival_registration.json; DV2-MAX / Fix2 / alternative-BDT declarations are inferred from "same configuration as fg1")
      record: tables/official_signal/production_record.json
    may_train: false
    may_evaluate: true
    # ---- everything below was MEASURED (SAM via env/sam_eaf.sh; full truth census of all flatCAFs), 2026-11-06 ----
    official_sam_definitions:
      reco1: aurora_SBND2026A_gen2_BNBLight_prodgenie_corsika_proton_rockbox0p1_sbnd_EX_ncdeltarad_v10_14_02_05_reco1_sbnd
      flat_caf: aurora_SBND2026A_gen2_BNBLight_prodgenie_corsika_proton_rockbox0p1_sbnd_EX_ncdeltarad_v10_14_02_05_flat_caf_sbnd
    sam:
      definition_flat_caf_id: 177787
      created_by: sbndpro, 2026-05-26
      software: {application: art sbndcode, version: v10_14_02_05, flatcaf_fcl: cafmakerjob_sbnd_sce_systtools_and_fluxwgt_and_g4rw.fcl, reco1_fcl: standard_reco1_sbnd.fcl}
      production: {name: Exclusive, type: aurora, project: SBND2026A_gen2_BNBLight}
      locations: "enstore:/pnfs/sbn/data_add/sbn_nd/aurora/mc/v10_14_02_05/prodgenie_corsika_proton_rockbox0p1_sbnd/Gen2_Exclusive_2026/ncdeltarad/... (one location per file; dCache path /pnfs/sbn/..., NOT /pnfs/sbnd/)"
      xrootd: "root://fndcadoor.fnal.gov//pnfs/fnal.gov/usr/sbn/... (xrd.to_xrootd_url maps it cleanly; files open from EAF, no staging delay observed)"
      reco1: {files: 16505, events: 14442, zero_event_files: 6923, size_bytes: 421918746965, mc_generated_event_count_per_file: 12500, sum_generated_events: 206312500, sum_mc_pot: 2.9696990390e21}
      flat_caf: {files: 15777, events: 13773, zero_event_files: 6626, size_bytes: 39904243228, sum_mc_pot: 2.83853154e21}
      reco1_files_without_flatcaf_child: {files: 728, events: 669, pot: 1.3116750e20, generated_events: 9100000}
      filenames_outside_git: "$SP_DATA/sam/official_gen2_ncdelta_{flatcaf,reco1}.files.txt, ..flatcaf.locations.txt, ..meta.csv.gz"
    flatcaf_census:     # tables/official_ncdelta/official_ncdelta_census.json; truth only, no Wire-Cell
      readable_files: 15777
      stored_events: 13773
      sum_TotalPOT: 2.8385315577e21
      sum_TotalGenEvents_in_caf: 1972125   # = 125 per file; NOT the generated-event count (SAM reco1: 12500 per unit, x100); do not use as a denominator
      events_with_record_verified_delta_radiative: 13773
      delta0_to_n_gamma: 7599
      deltaplus_to_p_gamma: 6174
    note: >
      Preferred signal evaluation sample (official Gen2). The official flatCAFs are readable from EAF (recTree + GenieEvtRecTree) and the Wire-Cell
      merged CAFs (fg1 chain) are registered through manifests/official_gen2_ncdelta_wc.tsv.gz (9,150 non-empty files; 6,626 empty units have no merged CAF).
      Accounting caveats (docs/analysis/NCDELTA_GENERATOR_FILTER_AUDIT.md section 4): use SAM mc.pot / mc.generated_event_count, not the CAF TotalGenEvents.
  aurora_ncdelta_training:
    role: training_development
    status: remains_on_aurora
    may_train: true
    may_evaluate: false
    note: >
      Isolated Aurora NC-Delta MC (~26.7k merged CAFs). Training / development / reconstruction-study material ONLY. Not to be
      transferred, not the baseline signal placeholder, and its numbers are never the evaluation denominator.
