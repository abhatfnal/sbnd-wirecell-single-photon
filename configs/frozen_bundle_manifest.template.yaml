# TEMPLATE of the manifest Aurora must deliver with the FROZEN model bundle before the EAF / FermiGrid independent evaluation (docs/analysis/UPSTREAM_WC_CLASSIFIER_EAF_INTEGRATION_READINESS.md, section 10).
# Nothing here is filled by EAF. `scripts/upstream_bundle_check.py BUNDLE.yaml` validates a filled copy (structure, hash formats, consistency with configs/upstream_release.yaml); it does not evaluate any model.
bundle_version: 1
frozen_utc: ""                      # timestamp of the freeze
frozen_by: ""                       # named person
code:
  repo: ""
  commit: ""
upstream_release:                   # must equal configs/upstream_release.yaml
  commit: 0f13988db44423a227789e151b0a374e25771abd
  nue: {folder: nue_round4_ruleA_v2, variant: main, manifest_sha256: 226ab04bc8a7d5feda2e1e7ae5168a595ee4a5bc8d4ae199c0272814640a8cb2}
  numu: {folder: numu_round3af, manifest_sha256: b900b33f453f1b52754e85605626859f7bd290cdb6e2e2cbac2d4e3fd5a328d6}
  sim_dqdx_k: 1.071
upstream_scorer:                    # the toolkit-equivalent scorer used for route R2 (Aurora sp_retrain/upstream_chain.py or portable successor); the numerical reference is the actual toolkit
  repo: ""
  commit: ""
  sha256: ""
  closure_report: ""                # path of the V3-V5 fixture closure report (exact agreement with the toolkit / in-chain values)
  closure_report_sha256: ""
  closure_exact: false              # must be true
  standalone_xgboost_used_for_production: false   # must be false
production:
  name: ""                          # the analysis production (WCLocal2026Nov16 or the effective-boundary production), with the toolkit commit
  wct: ""
  wc_tree: ""                       # recTreeWireCell (dv2_split_move) or other; the upstream release is verified for recTreeWireCell only
  vertex_configuration: ""          # dv2_split_move / snap, DL bundle sha256
  effective_boundary_treatment: ""  # box / effective boundary; which production implements it
  upstream_applicability_statement: ""   # Xuyang's statement that the released models apply to THIS production's inputs (the models were trained on WCLocal2026Nov16)
deployment_route:                   # R1 or R2 for the FINAL production (see configs/upstream_release.yaml, comment at the end)
  route: ""                         # R1 (final production already stores released-model scores) | R2 (offline regeneration with the toolkit-equivalent scorer)
  r1_evidence:                      # R1 only: evidence that the CORRECT upstream weights and correction configuration were applied to EVERY relevant simulation production job at BOTH sites, and no data job was corrected
    job_manifest_sha256: ""         # per-job table: site, sample, job id, weights directory fingerprints (== release chain fingerprints), numu_sim_dqdx_scale, reality
    all_sim_jobs_release_weights: false
    all_sim_jobs_k_1p071: false
    no_data_job_corrected: false
    sites: []                       # must name both production sites
  r2_evidence:                      # R2 only: NEW closure on the final domain
    final_domain_closure_report_sha256: ""
    final_domain_closure_exact: false
beam_off_normalization:             # required before any beam-off enters an evaluation (no factor is derived from physics distributions)
  evaluation_files: "even_run_only"
  even_run_exposure_ledger_sha256: ""      # gates/triggers/live-time per even-run file (the odd-run half is upstream training data and excluded)
  counter_convention: ""                   # gate counters vs recorded triggers, approved by the collaboration
  live_time_treatment: ""
  run_coverage_statement: ""               # compatibility with the open-data runs (no beam-off file exists in run 18255)
  approved_by: ""
sp_models:                          # the four retrained single-photon BDTs (numu, other, ncpi0, nue)
  - name: ""
    file: ""
    sha256: ""
    xgboost_version: ""
    inputs_file: ""                 # ordered feature list
    inputs_sha256: ""
    upstream_score_inputs: {}       # {feature name: overlay column}, e.g. numu_score: up_numu_score; must be a subset of sp_downstream_dependencies
    raw_features_used: []           # raw reconstruction features (never corrected)
    score_definition: ""            # raw margin / probability / log10 transform, applied once
    sentinel_policy: ""             # how non-finite inputs and unscored candidates are treated
    frozen_thresholds: {}           # the thresholds of the chain (cut values), frozen BEFORE evaluation
selection_manifest:
  file: ""
  sha256: ""
  candidate_policy: ""              # any / first / dedup
  fiducial_volume: ""
  signal_definition: ""             # truth definition and denominator
  topology_definition: ""           # reco 0p / Np, proton threshold
training_membership:                # needed for exact disjointness from the official samples
  manifests: []                     # [{sample, file_list_sha256, run_subrun_event_list_sha256, role: train|dev|test}]
  split_rule: ""
  beam_off_half_used_for_training: ""   # odd / even runs and file list
  nested_validation_report: ""
  sets_covered: []                  # must include upstream_fit, upstream_dev, sp_fit, sp_nested_val, sp_outer_holdout, dlvertex_train (or an explicit statement 'not available' per set)
  dlvertex_training_membership: "" # Snehadri's DL-vertex training samples (file list with sha256) or an explicit not-available statement
  beam_off_upstream_training_files: ""   # Xuyang's list of the beam-off files used for upstream training (the whole odd-run half is excluded regardless)
validation:
  development_only_results: ""      # path / hash of the Aurora-side nested validation report
  no_official_sample_used: true     # the bundle was fit and chosen without any official FermiGrid sample
