  vertex_configuration: ""          # dv2_split_move / snap, DL bundle sha256
  effective_boundary_treatment: ""  # box / effective boundary; which production implements it
  upstream_applicability_statement: ""   # Xuyang's statement that the released models apply to THIS production's inputs (the models were trained on WCLocal2026Nov16)
sp_models:                          # the four retrained single-photon BDTs (numu, other, ncpi0, nue)
  - name: ""
    file: ""
    sha256: ""
    xgboost_version: ""
    inputs_file: ""                 # ordered feature list
    inputs_sha256: ""
    upstream_score_inputs: {}       # {feature name: overlay column}, e.g. numu_score: up_numu_score; must be a subset of sp_downstream_dependencies
    raw_features_used: []           # raw reconstruction features (never corrected)
    score_definition: ""            # raw margin / probability / log10 transform, applied once
    sentinel_policy: ""             # how non-finite inputs and unscored candidates are treated
